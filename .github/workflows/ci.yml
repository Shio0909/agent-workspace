name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: agent-workspace
      - name: Build images
        run: make images
      - name: Load images
        run: kind load docker-image agent-workspace:local agent-workspace-demo:local --name agent-workspace
      - name: Smoke test
        run: ./scripts/kind-smoke.sh
