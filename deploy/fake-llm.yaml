# Deterministic OpenAI-compatible endpoint for the credential rotation demo.
# It is not a model: it only accepts the keys it has been told about.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: agent-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-llm
  template:
    metadata:
      labels:
        app: fake-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fake-llm
          image: agent-workspace-fakellm:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FAKE_LLM_KEYS
              value: key-v1
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: agent-workspace
spec:
  selector:
    app: fake-llm
  ports:
    - port: 8081
      targetPort: 8081
